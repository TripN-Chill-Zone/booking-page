name: Deploy to VPS

on:
  push:
    branches: [main]
    paths:
      - 'CSS-base.css'
      - 'beds24-iframe-helper.js'
      - 'booking-widget.js'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy files to VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${VPS_PORT:-22} $VPS_HOST >> ~/.ssh/known_hosts 2>/dev/null

          # Deploy each file if it exists in the repo
          for file in CSS-base.css beds24-iframe-helper.js booking-widget.js; do
            if [ -f "$file" ]; then
              scp -P ${VPS_PORT:-22} -i ~/.ssh/deploy_key "$file" root@$VPS_HOST:$VPS_PATH
              echo "Deployed $file"
            fi
          done
